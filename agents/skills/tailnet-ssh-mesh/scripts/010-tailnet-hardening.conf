# /etc/ssh/sshd_config.d/010-tailnet-hardening.conf
# Key-only SSH. Replace __USER__ with the login that should be permitted.
#
# Named 010- so it sorts BEFORE the vendor drop-in (macOS ships 100-macos.conf):
# sshd takes the FIRST value it sees for each keyword, so a later file cannot
# override an earlier one.
#
# macOS: launchd is socket-activated (one sshd per connection), so this applies
# to the next connection with no restart and no dropped sessions.
# systemd: sudo systemctl reload ssh

PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
AllowUsers __USER__
MaxAuthTries 3
LoginGraceTime 20
